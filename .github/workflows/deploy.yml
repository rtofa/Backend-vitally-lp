name: Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/rtofa/vitally-backend:main

  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Knockd e Abrir Porta SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y knockd
          knock -d 1000 ${{ secrets.EC2_HOST }} 7000 8000 9000
          sleep 3

      - name: Atualizar Backend na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /root/vitally-app
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u rtofa --password-stdin
            docker compose pull backend
            docker compose up -d backend

      - name: Fechar Porta SSH
        if: always()
        run: knock -d 1000 ${{ secrets.EC2_HOST }} 9000 8000 7000