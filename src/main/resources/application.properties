# ==========================================
# 1. SERVIDOR E APLICAÇÃO
# ==========================================
spring.application.name=api
server.port=8080

# Limite de tamanho para o upload de imagens no S3
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# 2. BANCO DE DADOS (RDS) E JPA
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# IMPORTANTE: Em produção, o Hibernate APENAS valida se as tabelas estão corretas.
# Quem cria ou altera as tabelas é o Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ==========================================
# 3. MIGRAÇÕES (FLYWAY)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# 4. SEGURANÇA (JWT)
# ==========================================
api.security.token.secret=${JWT_SECRET}

# ==========================================
# 5. AWS S3 (Credenciais e Config)
# ==========================================
AWS_REGION=${AWS_REGION}
AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
AWS_BUCKET_NAME=${AWS_BUCKET_NAME}